<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            *{
                margin: 0 auto;
                padding: 0;
            }
        .menu{
            background-color: rgb(9, 9, 10);
            width: 100%;
            height: 40px;
        }
        .menu ul{
            padding: 0;
            max-width: 500px;
        }
        .menu ul li{          
            background-color: rgb(9, 10, 10);
            color: white;
            float: left;
            width: 100px;
            height: 40px;
            display: inline-block;
            text-align: center;
            line-height: 40px;
            position: relative;
        }
 
        .menu ul li:hover{
            background-color:rgb(232, 23, 23); 
        }
        .menu .banana:hover{
            background-color:rgb(232, 218, 23); 
        }
        .menu .maca:hover{
            background-color:rgb(232, 23, 23); 
        }
        .menu .abacate:hover{
            background-color:rgb(41, 189, 4); 
        }
        .menu .abacaxi:hover{
            background-color:rgb(191, 141, 14); 
        }
        .menu ul ul{
            display: none;
        }
        .menu ul li:hover > ul{
            display: block;
        }
        
        .menu ul ul ul{
            margin-left: 102px;
            position: absolute;
            top: 0px;
        }
        .menu ul ul li:hover{
            background-color:rgb(17, 150, 90); 
        }
        .menu ul ul ul li:hover{
            background-color:rgb(67, 67, 132); 
        }
    </style>
</head>
<body>
    <header>
    <nav class="menu">
        <ul>
            <li class="banana">Banana</li>
            <li class="maca">Maça</li>
            <li class="abacate">Abacate
                <ul>
                    <li>Avocado</li>

                    <li>Importado</li>
                    </li>
                </ul>
            </li>
            <li class="abacaxi">Abacaxi</li>
            
                    </li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

</html>
